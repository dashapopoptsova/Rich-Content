<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РИЧ-контент — генератор баннеров</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #08080f;
      --surface:      #111120;
      --surface2:     #1a1a2e;
      --border:       #252540;
      --accent:       #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow:  rgba(124,58,237,.35);
      --accent-soft:  rgba(124,58,237,.08);
      --text:         #e2e8f0;
      --text-muted:   #64748b;
      --error-bg:     rgba(248,113,113,.1);
      --error-border: rgba(248,113,113,.35);
      --error-text:   #fca5a5;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 80px;
    }

    /* ── Шапка ── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 0 32px var(--accent-glow);
    }

    .logo-mark svg { width: 28px; height: 28px; color: #fff; }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: .95rem;
    }

    /* ── Карточка ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 580px;
    }

    /* ── Зона перетаскивания ── */
    .drop-zone {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 52px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      width: 44px; height: 44px;
      color: var(--accent);
      margin: 0 auto 16px;
      pointer-events: none;
    }

    .drop-zone h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      pointer-events: none;
    }

    .drop-zone p {
      font-size: .82rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ── Счётчик ── */
    .file-counter {
      display: none;
      text-align: right;
      font-size: .78rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .file-counter b { color: var(--accent); }

    /* ── Превью ── */
    .previews {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .preview-item {
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .preview-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Ошибка ── */
    .error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--error-text);
      font-size: .88rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* ── Кнопка ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      margin-top: 28px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .2px;
      transition: opacity .2s, box-shadow .2s, transform .1s;
    }

    .btn:hover:not(:disabled) {
      box-shadow: 0 0 28px var(--accent-glow);
    }

    .btn:active:not(:disabled) { transform: scale(.98); }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    /* ── Спиннер ── */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Подсказка ── */
    .hint {
      text-align: center;
      color: var(--text-muted);
      font-size: .78rem;
      margin-top: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <path d="M3 9h18M9 21V9"/>
    </svg>
  </div>
  <h1>РИЧ-контент</h1>
  <p>Генератор вертикальных баннеров для маркетплейсов</p>
</header>

<div class="card">
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form id="form" method="POST" action="/generate" enctype="multipart/form-data">
    <div class="drop-zone" id="dropZone">
      <input type="file" name="images" id="fileInput" multiple accept=".jpg,.jpeg,.png,.jfif">
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
      </svg>
      <h2>Перетащите фотографии товара</h2>
      <p>или нажмите для выбора файлов</p>
    </div>

    <div class="file-counter" id="counter">
      Выбрано: <b id="countNum">0</b>&nbsp;/ 10
    </div>

    <div class="previews" id="previews"></div>

    <button type="submit" class="btn" id="submitBtn" disabled>
      <span id="btnText">Сгенерировать баннер</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>

  <p class="hint">
    От 3 до 10 изображений · JPG, PNG · до 5 МБ каждый<br>
    Среднее время генерации — 30–60 секунд
  </p>
</div>

<script>
  const input     = document.getElementById('fileInput');
  const dropZone  = document.getElementById('dropZone');
  const previews  = document.getElementById('previews');
  const counter   = document.getElementById('counter');
  const countNum  = document.getElementById('countNum');
  const submitBtn = document.getElementById('submitBtn');
  const form      = document.getElementById('form');
  const btnText   = document.getElementById('btnText');
  const spinner   = document.getElementById('spinner');

  function updateUI(files) {
    const n = files.length;
    previews.innerHTML = '';
    counter.style.display = n ? 'block' : 'none';
    countNum.textContent = n;
    submitBtn.disabled = n < 3 || n > 10;

    Array.from(files).forEach(file => {
      const div = document.createElement('div');
      div.className = 'preview-item';
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = file.name;
      div.appendChild(img);
      previews.appendChild(div);
    });
  }

  input.addEventListener('change', () => updateUI(input.files));

  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (!e.dataTransfer.files.length) return;
    const dt = new DataTransfer();
    Array.from(e.dataTransfer.files).forEach(f => dt.items.add(f));
    input.files = dt.files;
    updateUI(input.files);
  });

  form.addEventListener('submit', () => {
    btnText.style.display = 'none';
    spinner.style.display = 'block';
    submitBtn.disabled = true;
  });
</script>

</body>
</html>
