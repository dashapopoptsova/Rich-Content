<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Результат — РИЧ-контент</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #08080f;
      --surface:      #111120;
      --surface2:     #1a1a2e;
      --border:       #252540;
      --accent:       #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow:  rgba(124,58,237,.35);
      --accent-soft:  rgba(124,58,237,.08);
      --text:         #e2e8f0;
      --text-muted:   #64748b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 0 32px var(--accent-glow);
    }

    .logo-mark svg { width: 28px; height: 28px; color: #fff; }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* ── Превью баннера ── */
    .banner-wrap {
      width: 100%;
      height: 65vh;
      min-height: 320px;
      max-height: 700px;
      overflow-y: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface2);
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--surface2);
    }

    .banner-wrap::-webkit-scrollbar       { width: 6px; }
    .banner-wrap::-webkit-scrollbar-track { background: var(--surface2); border-radius: 99px; }
    .banner-wrap::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

    .banner-wrap img {
      width: 100%;
      display: block;
    }

    /* ── Кнопки ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: .2px;
      transition: box-shadow .2s, transform .1s;
    }

    .btn:hover { box-shadow: 0 0 28px var(--accent-glow); }
    .btn:active { transform: scale(.98); }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .2s, color .2s;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .hint {
      color: var(--text-muted);
      font-size: .75rem;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <path d="M3 9h18M9 21V9"/>
    </svg>
  </div>
  <h1>Баннер готов</h1>
  <p>Прокрутите для просмотра, затем скачайте</p>
</header>

<div class="card">
  <div class="banner-wrap">
    <img src="/preview/{{ filename }}" alt="Готовый РИЧ-баннер">
  </div>

  <div class="actions">
    <a href="/download/{{ filename }}" class="btn" download>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
      </svg>
      Скачать
    </a>
    <a href="/" class="btn-secondary">← Сгенерировать ещё</a>
  </div>

  <p class="hint">{{ filename }}</p>
</div>

</body>
</html>
